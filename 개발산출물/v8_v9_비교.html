<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문턱 시안 v8·v9 비교</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --bg: #f4f4f1; --ink: #17181c; --sub: #5a5e68; --line: #e2e1dc; --card: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Pretendard Variable", Pretendard, -apple-system, "Malgun Gothic", sans-serif; font-size: 15px; line-height: 1.6; word-break: keep-all; }
  main { max-width: 1680px; margin: 0 auto; padding: 36px 24px 56px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -.03em; }
  .lead { margin: 6px 0 22px; color: var(--sub); }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .tabs button { font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--sub); cursor: pointer; }
  .tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .col { background: var(--card); border-radius: 18px; box-shadow: 0 0 0 1px var(--line), 0 16px 32px -24px rgba(0,0,0,.25); overflow: hidden; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .head b { font-size: 17px; }
  .head span { display: block; font-size: 13px; color: var(--sub); }
  .head a { flex: none; font-size: 14px; font-weight: 600; padding: 7px 12px; border-radius: 8px; background: var(--bg); color: var(--ink); text-decoration: none; }
  .head a:hover { background: #e9e8e3; }
  .v8 .head b::before, .v9 .head b::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; }
  .v8 .head b::before { background: #0a5cff; }
  .v9 .head b::before { background: #ff6b35; }
  .frame { position: relative; height: 78vh; overflow: hidden; background: #fafafa; }
  .frame iframe { position: absolute; left: 0; top: 0; width: 1440px; border: 0; transform-origin: 0 0; }
  .note { margin-top: 18px; font-size: 13px; color: var(--sub); }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } .frame { height: 70vh; } }
</style>
</head>
<body>
<main>
  <h1>문턱 디자인 시안 v8 · v9 비교</h1>
  <p class="lead">같은 화면을 나란히 놓았어요. 각 화면 안에서 스크롤할 수 있고, ‘새 창’을 누르면 원래 크기로 열려요.</p>
  <div class="tabs" role="tablist">
    <button class="on" data-i="0">01 시작</button>
    <button data-i="1">02 올리기</button>
    <button data-i="2">03 결과</button>
    <button data-i="3">04 비교</button>
  </div>
  <div class="grid">
    <section class="col v8">
      <div class="head"><div><b>v8 · 영수증 + v4</b><span>흰 바탕·파랑에 영수증 요소를 얹음</span></div><a target="_blank" rel="noopener">새 창 ↗</a></div>
      <div class="frame"><iframe title="v8 화면"></iframe></div>
    </section>
    <section class="col v9">
      <div class="head"><div><b>v9 · v5 절충</b><span>검정 무대 + 탠저린, 영수증이 무대 아래로 걸침</span></div><a target="_blank" rel="noopener">새 창 ↗</a></div>
      <div class="frame"><iframe title="v9 화면"></iframe></div>
    </section>
  </div>
  <p class="note">넓은 PC 화면(1440px) 기준 시안을 줄여서 보여 줘요. 계산 기능은 없고, 숫자는 가상 샘플 값이에요.</p>
</main>
<script>
(function () {
  var base = 'https://htmlpreview.github.io/?https://github.com/JIHOSW/Hackathon/blob/ui/design-system/' + encodeURIComponent('개발산출물') + '/';
  var files = ['01_시작_PC.html', '02_올리기_PC.html', '03_결과_PC.html', '04_제안비교_PC.html'];
  var url = function (v, i) { return base + encodeURIComponent('디자인_' + v) + '/' + encodeURIComponent(files[i]); };
  var cols = [['v8', document.querySelector('.v8')], ['v9', document.querySelector('.v9')]];
  function fit() {
    cols.forEach(function (c) {
      var box = c[1].querySelector('.frame'), f = box.querySelector('iframe'), k = box.clientWidth / 1440;
      f.style.transform = 'scale(' + k + ')'; f.style.height = (box.clientHeight / k) + 'px';
    });
  }
  function show(i) {
    document.querySelectorAll('.tabs button').forEach(function (b) { b.classList.toggle('on', Number(b.dataset.i) === i); });
    cols.forEach(function (c) { var u = url(c[0], i); c[1].querySelector('iframe').src = u; c[1].querySelector('a').href = u; });
  }
  document.querySelectorAll('.tabs button').forEach(function (b) { b.addEventListener('click', function () { show(Number(b.dataset.i)); }); });
  addEventListener('resize', fit);
  fit(); show(0);
})();
</script>
</body>
</html>
